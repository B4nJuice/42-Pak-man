[project]
name = "pak-man"
version = "0.1.0"
description = "42 project pak-man"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mazegenerator",
    "pydantic>=2.13.5",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.uv]
cache-dir = "/tmp/.uv_cache"
link-mode = "symlink"

[tool.uv.sources]
mazegenerator = { path = "lib/mazegenerator-2.1.0-py3-none-any.whl" }

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff]
line-length = 79
