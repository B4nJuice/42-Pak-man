name: Python Checks

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-typecheck:
    name: Flake8 & Mypy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Flake8-pyproject mypy

      - name: Run Flake8
        run: flake8 .

      - name: Run Mypy
        run: mypy .
